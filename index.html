<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchlist — knowjoby</title>
<meta name="description" content="Movies and web series I'm watching, have watched, or want to watch.">
<style>
:root{--bg:#fafaf9;--card:#fff;--fg:#1c1917;--muted:#57534e;--line:#e7e5e4;--accent:#2563eb;--tag:#f5f5f4;--star:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--card:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--line:#292524;--accent:#60a5fa;--tag:#292524;--star:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:48px 16px 64px}
h1{margin:0 0 6px;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em}
.sub{margin:0 0 24px;color:var(--muted)}
.sub a{color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:10px 14px;color:var(--muted);text-decoration:none;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-selected=true]{color:var(--fg);border-color:var(--fg);font-weight:600}
.tabs a span{font-size:12px;color:var(--muted);margin-left:5px;font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.filters .sep{width:1px;background:var(--line);margin:4px 4px}
h3.more{font-size:15px;margin:36px 0 12px;color:var(--muted);font-weight:600}
.morebtn{display:inline-block;margin-top:16px;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none}
.morebtn:hover{border-color:var(--fg)}
.morebtn span{color:var(--muted);margin-left:4px}
.filters button{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;list-style:none;margin:0;padding:0}
.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 0 18px;overflow:hidden}
.card>*:not(.pwrap){margin-left:18px!important;margin-right:18px!important}
.poster{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--tag);display:block;margin-bottom:6px}
.noposter{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px}
.kicker{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.bar{height:4px;background:var(--tag);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.stat{font-size:13px;color:var(--muted);margin:0}
.count{color:var(--muted);font-size:14px;margin:-8px 0 16px}
.card h2{margin:0;font-size:17px}
.card h2 small{color:var(--muted);font-weight:400}
.card p{margin:0;color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;font-size:12.5px}
.tag{background:var(--tag);padding:2px 8px;border-radius:999px;color:var(--muted)}
.watching{color:var(--accent);background:transparent;border:1px solid currentColor}
.pwrap{position:relative;margin:0 0 6px!important}
.pwrap .poster{margin:0}
.score{position:absolute;top:10px;right:10px;background:rgba(12,10,9,.82);color:#fbbf24;font-weight:700;font-size:15px;padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.score small{color:#d6d3d1;font-weight:500;font-size:11px;margin-left:1px}
.empty{color:var(--muted);padding:32px 0}
footer{margin-top:40px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.st-paused,.st-dropped{opacity:.8}
</style>
</head>
<body>
<main>
<h1>Watchlist</h1>
<p class="sub">Movies and web series I've been watching, synced from my Obsidian Movies &amp; Series log. More of my <a href="https://knowjoby.github.io/creations/">creations</a>.</p>
<nav class="tabs" role="tablist" aria-label="Viewing status" id="tabs"></nav>
<div class="filters" role="group" aria-label="Filter" id="filters"></div>
<p class="count" id="count"></p>
<ul class="grid" id="grid"></ul>
<p class="empty" id="empty" hidden>Nothing here yet.</p>
<div id="more"></div>
<footer><span id="updated"></span></footer>
</main>
<script>
const TABS=[["watching","Watching",i=>i.status==="watching"],["watched","Watched",i=>i.status==="watched"],["want","Want to watch",i=>i.status==="want"],["hold","On hold",i=>i.status==="paused"],["dropped","Dropped",i=>i.status==="dropped"],["other","Everything else",i=>!["watching","watched","want","paused","dropped"].includes(i.status)]];
const hold={paused:"Paused",dropped:"Dropped"};
const kind={series:"Series",movie:"Movie",unsorted:"Not yet sorted"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const hm=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`;
try{localStorage.removeItem("wl_token")}catch{}
let items=[],tab="watching",type="all",plat="";
const byDate=(a,b)=>(b.date||"").localeCompare(a.date||"")||a.title.localeCompare(b.title);
const sorter=t=>t==="watched"?(a,b)=>(b.rating||0)-(a.rating||0)||byDate(a,b):byDate;
// Watched means finished: show it as 100% whatever the sampled playback reached.
const card=j=>{const i=j.status==="watched"?{...j,progress:100}:j;return card0(i)};
const card0=i=>`<li class="card st-${i.status}"><div class="pwrap">
${i.poster?`<img class="poster" loading="lazy" referrerpolicy="no-referrer" src="${esc(i.poster)}" alt="" onerror="this.outerHTML='<div class=&quot;poster noposter&quot;>🎬</div>'">`:`<div class="poster noposter">🎬</div>`}${i.rating?`<span class="score" aria-label="Rated ${i.rating} out of 10">★ ${i.rating}<small>/10</small></span>`:""}</div>
<p class="kicker">${kind[i.type]||"Title"}${i.platform?" · "+esc(i.platform):""}${i.year?" · "+i.year:""}</p>
<h2>${esc(i.title)}</h2>
${i.take?`<p>${esc(i.take)}</p>`:""}
${i.date||i.minutes?`<p class="stat">${[i.date,i.minutes?"▶ "+hm(i.minutes)+" played":"",i.progress!=null?i.progress+"% through":"",i.episodes?i.episodes+" ep"+(i.episodes>1?"s":"")+" finished":""].filter(Boolean).join(" · ")}</p>`:""}
${i.progress!=null?`<div class="bar" aria-hidden="true"><span style="width:${i.progress}%"></span></div>`:""}
${hold[i.status]?`<div class="meta"><span class="tag">${hold[i.status]}</span></div>`:""}
</li>`;
function render(){
  const T=TABS.find(t=>t[0]===tab)||TABS[0];
  document.getElementById("tabs").innerHTML=TABS.map(([k,l,fn])=>`<a href="#${k}" role="tab" aria-selected="${k===T[0]}">${l}<span>${items.filter(fn).length}</span></a>`).join("");
  const inTab=items.filter(T[2]);
  const plats=[...new Set(inTab.map(i=>i.platform).filter(Boolean))].sort();
  if(plat&&!plats.includes(plat))plat="";
  const chip=(k,l,on)=>`<button data-k="${esc(k)}" aria-pressed="${on}">${esc(l)}</button>`;
  const types=[["all","All"],["movie","Movies"],["series","Series"]].filter(([k])=>k==="all"||inTab.some(i=>i.type===k));
  document.getElementById("filters").innerHTML=types.map(([k,l])=>chip("t:"+k,l,type===k)).join("")+(plats.length>1?`<span class="sep"></span>`+plats.map(p=>chip("p:"+p,p,plat===p)).join(""):"");
  const shown=inTab.filter(i=>(type==="all"||i.type===type)&&(!plat||i.platform===plat)).sort(sorter(T[0]));
  document.getElementById("grid").innerHTML=shown.map(card).join("");
  document.getElementById("count").textContent=`${shown.length} title${shown.length===1?"":"s"}`;
  document.getElementById("empty").hidden=shown.length>0;
  let more="";
  if(T[0]==="watching"&&type==="all"&&!plat){const done=items.filter(TABS.find(t=>t[0]==="watched")[2]).sort(byDate);if(done.length)more=`<h3 class="more">Recently watched</h3><ul class="grid">${done.slice(0,5).map(card).join("")}</ul>`+(done.length>5?`<a class="morebtn" href="#watched">More watched <span>${done.length}</span></a>`:"")}
  document.getElementById("more").innerHTML=more;
}
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("button[data-k]");if(!b)return;const [g,v]=[b.dataset.k.slice(0,1),b.dataset.k.slice(2)];if(g==="t")type=v;else plat=plat===v?"":v;render()});
function route(){const h=location.hash.slice(1);tab=TABS.some(t=>t[0]===h)?h:"watching";type="all";plat="";render()}
window.addEventListener("hashchange",route);
fetch("watchlist.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{items=d.items||[];if(d.updated)document.getElementById("updated").textContent="Updated "+d.updated;route()}).catch(route);
</script>
</body>
</html>
